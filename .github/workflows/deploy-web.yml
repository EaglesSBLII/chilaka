# Publishes the web app (chilaka.pages.dev) and the sync/speech worker on every
# push to main, so iPhones pick up a new version on their next launch without
# anyone running a command. Needs two repository secrets (Settings → Secrets →
# Actions): CLOUDFLARE_API_TOKEN (Pages:Edit + Workers Scripts:Edit + D1:Edit) and
# CLOUDFLARE_API_ACCOUNT_ID.
name: Deploy web app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci -w app --include-workspace-root
      - run: npm test -w app
      - run: npm run build -w app
      - name: Deploy to Cloudflare Pages
        # project name, output dir and the VISITS KV binding come from app/wrangler.toml
        run: npx wrangler pages deploy --branch main
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_API_ACCOUNT_ID }}

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the worker
        run: npm test
        working-directory: sync-worker
      - name: Apply D1 migrations (accounts + reminders)
        # Needs the real database_id in sync-worker/wrangler.toml — see
        # docs/CLOUDFLARE-SETUP.md → "Accounts (D1)".
        # skipped until the D1 block in wrangler.toml is uncommented (one-time owner setup)
        run: |
          if grep -q '^\[\[d1_databases\]\]' wrangler.toml; then
            npx --yes wrangler d1 migrations apply chilaka --remote
          else
            echo "D1 not configured yet — skipping migrations (accounts stay off)"
          fi
        working-directory: sync-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_API_ACCOUNT_ID }}
      - name: Deploy the sync + speech worker
        run: npx --yes wrangler deploy
        working-directory: sync-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_API_ACCOUNT_ID }}

  admin:
    # Private owner dashboard (account emails + visit log). It answers nothing
    # until the owner sets a password: node tools/admin-password.mjs (docs/ADMIN.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Test the dashboard worker
        run: npm test
        working-directory: admin-worker
      - name: Build the developer version from what was just released
        # after a release the developer version is the same as the released app;
        # tools/publish-dev.mjs (run from the owner's Mac) later adds unreleased changes on top
        run: |
          npm ci -w app --include-workspace-root
          node tools/publish-dev.mjs --no-deploy
      - name: Deploy the dashboard worker
        run: npx --yes wrangler deploy
        working-directory: admin-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_API_ACCOUNT_ID }}
